<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNSレコード早見ツール | Computer Basics Lab</title><meta name="description" content="A、AAAA、CNAME、MX、TXT、NS、PTR、SRV、CAA、SOAなど主要DNSレコードの意味と例をすぐ確認できます。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/dns-records/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.record-tabs{display:flex;gap:6px;overflow:auto;padding:6px 0;scrollbar-width:none}.record-tabs::-webkit-scrollbar{display:none}.record-tabs button{flex:none}.record-detail{margin-top:12px;border:1px solid #aaa;background:#fafafa}.record-head{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid #aaa}.record-type{display:grid;place-items:center;background:#111;color:#fff;font:900 22px ui-monospace,SFMono-Regular,Menlo,monospace}.record-head div:last-child{padding:11px}.record-head strong{display:block}.record-head span{display:block;margin-top:2px;color:#666;font-size:11px}.record-body{padding:11px}.record-body p{margin:0;color:#444;font-size:13px}.record-body .mono-block{margin-top:9px}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="dns-records-tool"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../dns/">DNSを学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">DNS RECORDS</span><h1>DNSレコード早見</h1><p>種類をタップすると、意味と例をすぐ確認できます。</p></section><section class="tool-panel"><div class="record-tabs" role="group" aria-label="DNSレコード種類"><button class="tool-btn primary" type="button" data-record="A">A</button><button class="tool-btn" type="button" data-record="AAAA">AAAA</button><button class="tool-btn" type="button" data-record="CNAME">CNAME</button><button class="tool-btn" type="button" data-record="MX">MX</button><button class="tool-btn" type="button" data-record="TXT">TXT</button><button class="tool-btn" type="button" data-record="NS">NS</button><button class="tool-btn" type="button" data-record="PTR">PTR</button><button class="tool-btn" type="button" data-record="SRV">SRV</button><button class="tool-btn" type="button" data-record="CAA">CAA</button><button class="tool-btn" type="button" data-record="SOA">SOA</button></div><div class="record-detail"><div class="record-head"><div class="record-type" data-type>A</div><div><strong data-title>IPv4アドレス</strong><span data-short>名前 → IPv4</span></div></div><div class="record-body"><p data-desc></p><div class="mono-block" data-example></div></div></div></section></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{const d={A:['IPv4アドレス','名前 → IPv4','ホスト名に対応するIPv4アドレスを指定します。','www.example.com.  300  IN  A  203.0.113.10'],AAAA:['IPv6アドレス','名前 → IPv6','ホスト名に対応するIPv6アドレスを指定します。','www.example.com.  300  IN  AAAA  2001:db8::10'],CNAME:['別名','別名 → 正式名','ある名前を別の正規名へ対応付けます。CNAMEの参照先で最終的なA/AAAAなどを調べます。','shop.example.com.  300  IN  CNAME  web.example.net.'],MX:['メール配送先','ドメイン → メールサーバー','そのドメイン宛メールを受け取るメールサーバーと優先度を指定します。','example.com.  300  IN  MX  10  mail.example.com.'],TXT:['テキスト情報','ドメイン → 任意テキスト','SPF、ドメイン所有確認など幅広い用途で使われます。','example.com.  300  IN  TXT  "v=spf1 include:_spf.example.net -all"'],NS:['権威DNS','ゾーン → DNSサーバー','そのゾーンを担当する権威DNSサーバーを示します。','example.com.  86400  IN  NS  ns1.example.net.'],PTR:['逆引き','IP → 名前','主に逆引きDNSでIPアドレスからホスト名を示します。','10.113.0.203.in-addr.arpa.  IN  PTR  host.example.com.'],SRV:['サービス位置','サービス → host:port','特定サービスを提供するホストとポート、優先度、重みを指定します。','_sip._tcp.example.com.  IN  SRV  10 60 5060 sip.example.com.'],CAA:['証明書発行CA','ドメイン → 許可CA','そのドメインの証明書を発行してよい認証局を指定できます。','example.com.  IN  CAA  0 issue "letsencrypt.org"'],SOA:['ゾーン管理情報','ゾーンの基本情報','ゾーンの主要DNS、管理者、シリアル、更新間隔などを持つStart of Authorityレコードです。','example.com. IN SOA ns1.example.net. hostmaster.example.com. 2026082801 3600 600 86400 300']};const buttons=[...document.querySelectorAll('[data-record]')];const show=k=>{const x=d[k];document.querySelector('[data-type]').textContent=k;document.querySelector('[data-title]').textContent=x[0];document.querySelector('[data-short]').textContent=x[1];document.querySelector('[data-desc]').textContent=x[2];document.querySelector('[data-example]').textContent=x[3];buttons.forEach(b=>b.classList.toggle('primary',b.dataset.record===k))};buttons.forEach(b=>b.onclick=()=>show(b.dataset.record));show('A')})();</script></body></html>
