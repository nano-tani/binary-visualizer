<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTPステータスコード検索ツール | Computer Basics Lab</title><meta name="description" content="HTTPステータスコードを番号・名前・意味から検索し、1xx〜5xxで絞り込み。代表的な利用場面も確認できます。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/http-status/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.status-filters{display:flex;gap:6px;overflow:auto;margin-top:10px;scrollbar-width:none}.status-filters::-webkit-scrollbar{display:none}.status-filters .tool-btn{flex:none}.status-list{display:grid;gap:6px;margin-top:10px}.status-item{display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:start;padding:10px;border:1px solid #bbb;background:#fafafa}.status-code{font:900 24px ui-monospace,SFMono-Regular,Menlo,monospace}.status-item strong{display:block}.status-item span{display:block;margin-top:2px;color:#666;font-size:11px}.status-use{margin-top:5px!important;color:#333!important}.status-copy{border:1px solid #bbb;background:#fff;min-height:34px;padding:5px 8px;font-size:11px;font-weight:800}@media(max-width:520px){.status-item{grid-template-columns:62px 1fr}.status-copy{grid-column:2;justify-self:start}}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="http-status-tool"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../http-status/">仕組みを学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">HTTP STATUS</span><h1>HTTPステータス検索</h1><p>コード番号、英語名、日本語の意味から検索できます。</p></section><section class="tool-panel"><div class="tool-field"><label for="statusSearch">コード・名前・意味</label><input id="statusSearch" class="tool-input mono" type="search" value="404" placeholder="例: 404 / redirect / 認証"></div><div class="status-filters" role="group" aria-label="ステータス分類"><button class="tool-btn primary" type="button" data-class="all">すべて</button><button class="tool-btn" type="button" data-class="1">1xx 情報</button><button class="tool-btn" type="button" data-class="2">2xx 成功</button><button class="tool-btn" type="button" data-class="3">3xx リダイレクト</button><button class="tool-btn" type="button" data-class="4">4xx クライアント</button><button class="tool-btn" type="button" data-class="5">5xx サーバー</button></div><div class="tool-actions"><button class="tool-btn soft" type="button" data-q="200">200</button><button class="tool-btn soft" type="button" data-q="301">301</button><button class="tool-btn soft" type="button" data-q="404">404</button><button class="tool-btn soft" type="button" data-q="429">429</button><button class="tool-btn soft" type="button" data-q="500">500</button><button class="tool-btn soft" type="button" data-q="503">503</button></div><div class="tool-note" data-msg></div><div class="status-list" data-list></div></section><details class="tool-more"><summary>分類の見方</summary><p>1xxは情報、2xxは成功、3xxはリダイレクトなど、4xxはリクエスト側に関係する問題、5xxはサーバーが要求を処理できない状態を表します。</p><p><a class="tool-link" href="../../http-status/">HTTPステータスコードの仕組みを理解する →</a></p></details></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{'use strict';const data=[[100,'Continue','処理を続けてよい','Expect: 100-continue を使う通信'],[101,'Switching Protocols','プロトコル切り替え','WebSocketなどへの切り替え'],[103,'Early Hints','本応答前にヒントを返す','Linkヘッダーによるpreload'],[200,'OK','リクエスト成功','GETやAPIの一般的な成功'],[201,'Created','新しいリソースを作成','POSTで新規データを作成'],[202,'Accepted','処理を受け付けた','非同期ジョブの受付'],[204,'No Content','成功したが返す本文はない','DELETEや更新処理の成功'],[206,'Partial Content','一部分だけ返す','Rangeリクエスト'],[301,'Moved Permanently','恒久的なリダイレクト','URLを恒久的に移転'],[302,'Found','一時的なリダイレクト','一時的な転送'],[303,'See Other','別URLをGETで参照','POST後の結果画面など'],[304,'Not Modified','キャッシュを再利用できる','条件付きGET'],[307,'Temporary Redirect','メソッドを維持する一時転送','POSTなどを保持して転送'],[308,'Permanent Redirect','メソッドを維持する恒久転送','恒久転送でメソッド保持'],[400,'Bad Request','リクエストを正しく解釈できない','JSONやパラメータの形式不正'],[401,'Unauthorized','認証が必要または認証に失敗','ログインやトークンが必要'],[403,'Forbidden','理解したがアクセスを拒否','権限不足'],[404,'Not Found','対象のリソースが見つからない','URLやAPIパスが存在しない'],[405,'Method Not Allowed','そのHTTPメソッドは許可されていない','GETのみのURLへPOSTなど'],[409,'Conflict','現在の状態と競合','重複登録や更新競合'],[410,'Gone','リソースが恒久的に存在しない','削除済みで復旧予定なし'],[413,'Content Too Large','送信内容が大きすぎる','アップロード上限超過'],[415,'Unsupported Media Type','Content-Typeなどが未対応','未対応形式の送信'],[418,"I'm a teapot",'ジョークとして定義されたコード','RFC 2324由来'],[422,'Unprocessable Content','形式は読めるが内容を処理できない','入力値の検証エラー'],[429,'Too Many Requests','短時間にリクエストが多すぎる','APIレート制限'],[500,'Internal Server Error','サーバー内部で予期しないエラー','アプリ内部エラー'],[501,'Not Implemented','要求された機能を実装していない','未対応メソッドなど'],[502,'Bad Gateway','上流サーバーから不正な応答','リバースプロキシと上流の問題'],[503,'Service Unavailable','一時的にサービスを提供できない','メンテナンスや過負荷'],[504,'Gateway Timeout','上流サーバーの応答待ちがタイムアウト','プロキシやゲートウェイの待ち時間超過'],[511,'Network Authentication Required','ネットワーク認証が必要','公衆Wi-Fiの認証画面など']];const q=document.getElementById('statusSearch'),list=document.querySelector('[data-list]'),msg=document.querySelector('[data-msg]'),buttons=[...document.querySelectorAll('[data-class]')];let cls='all';const copy=async(v,b)=>{try{await navigator.clipboard.writeText(v);const t=b.textContent;b.textContent='コピー済み';setTimeout(()=>b.textContent=t,900)}catch{prompt('コピーしてください',v)}};const run=()=>{const s=q.value.trim().toLowerCase();const r=data.filter(x=>(cls==='all'||String(x[0])[0]===cls)&&(!s||String(x[0]).includes(s)||x[1].toLowerCase().includes(s)||x[2].toLowerCase().includes(s)||x[3].toLowerCase().includes(s)));list.innerHTML=r.map(x=>'<div class="status-item"><div class="status-code">'+x[0]+'</div><div><strong>'+x[1]+'</strong><span>'+x[2]+' · '+String(x[0])[0]+'xx</span><span class="status-use">例: '+x[3]+'</span></div><button class="status-copy" type="button" data-copy-code="'+x[0]+'">コピー</button></div>').join('');msg.textContent=r.length?r.length+'件表示':'見つかりません';document.querySelectorAll('[data-copy-code]').forEach(b=>b.onclick=()=>copy(b.dataset.copyCode+' '+(data.find(x=>String(x[0])===b.dataset.copyCode)||[])[1],b))};q.oninput=run;buttons.forEach(b=>b.onclick=()=>{cls=b.dataset.class;buttons.forEach(x=>x.classList.toggle('primary',x===b));run()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;cls='all';buttons.forEach(x=>x.classList.toggle('primary',x.dataset.class==='all'));run()});run()})();</script></body></html>
