<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTPステータスコード検索ツール | Computer Basics Lab</title><meta name="description" content="200、301、404、500などHTTPステータスコードを番号や意味から即検索。分類と代表的な意味をすぐ確認できます。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/http-status/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.status-list{display:grid;gap:6px;margin-top:10px}.status-item{display:grid;grid-template-columns:68px 1fr;gap:10px;padding:10px;border:1px solid #bbb;background:#fafafa}.status-code{font:900 24px ui-monospace,SFMono-Regular,Menlo,monospace}.status-item strong{display:block}.status-item span{display:block;margin-top:2px;color:#666;font-size:11px}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="http-status-tool"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../http-status/">仕組みを学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">HTTP STATUS</span><h1>HTTPステータス検索</h1><p>404、500、redirect などで検索。</p></section><section class="tool-panel"><div class="tool-field"><label for="statusSearch">コード・名前・意味</label><input id="statusSearch" class="tool-input mono" type="search" value="404" placeholder="例: 404 / redirect / server"></div><div class="tool-actions"><button class="tool-btn soft" type="button" data-q="200">200</button><button class="tool-btn soft" type="button" data-q="301">301</button><button class="tool-btn soft" type="button" data-q="404">404</button><button class="tool-btn soft" type="button" data-q="429">429</button><button class="tool-btn soft" type="button" data-q="500">500</button><button class="tool-btn soft" type="button" data-q="503">503</button></div><div class="tool-note" data-msg></div><div class="status-list" data-list></div></section></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{const data=[[100,'Continue','処理を続けてよい'],[101,'Switching Protocols','プロトコル切り替え'],[200,'OK','リクエスト成功'],[201,'Created','新しいリソースを作成'],[204,'No Content','成功したが返す本文はない'],[301,'Moved Permanently','恒久的なリダイレクト'],[302,'Found','一時的なリダイレクトとしてよく使われる'],[304,'Not Modified','キャッシュ済み表現を再利用できる'],[400,'Bad Request','リクエストを正しく解釈できない'],[401,'Unauthorized','認証が必要または認証に失敗'],[403,'Forbidden','理解したがアクセスを拒否'],[404,'Not Found','対象のリソースが見つからない'],[405,'Method Not Allowed','そのHTTPメソッドは許可されていない'],[409,'Conflict','現在の状態と競合'],[415,'Unsupported Media Type','Content-Typeなどが未対応'],[418,"I'm a teapot",'ジョークとして定義されたコード'],[422,'Unprocessable Content','形式は読めるが内容を処理できない'],[429,'Too Many Requests','短時間にリクエストが多すぎる'],[500,'Internal Server Error','サーバー内部で予期しないエラー'],[501,'Not Implemented','要求された機能を実装していない'],[502,'Bad Gateway','上流サーバーから不正な応答'],[503,'Service Unavailable','一時的にサービスを提供できない'],[504,'Gateway Timeout','上流サーバーの応答待ちがタイムアウト']];const q=document.getElementById('statusSearch'),list=document.querySelector('[data-list]'),msg=document.querySelector('[data-msg]');const cls=n=>Math.floor(n/100)+'xx';const run=()=>{const s=q.value.trim().toLowerCase();const r=data.filter(x=>!s||String(x[0])===s||x[1].toLowerCase().includes(s)||x[2].toLowerCase().includes(s)||cls(x[0]).includes(s));list.innerHTML=r.map(x=>'<div class="status-item"><div class="status-code">'+x[0]+'</div><div><strong>'+x[1]+'</strong><span>'+x[2]+' · '+cls(x[0])+'</span></div></div>').join('');msg.textContent=r.length?r.length+'件表示':'見つかりません'};q.oninput=run;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;run()});run()})();</script></body></html>
