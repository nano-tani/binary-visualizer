<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix時間・タイムスタンプ変換ツール | Computer Basics Lab</title><meta name="description" content="Unix時間を日本時間・UTC・ISO 8601へ変換し、日時からUnix秒・ミリ秒へ変換できます。10桁・13桁を自動判定します。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/unix-time/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.time-choice{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.live-time{margin-top:10px;border:1px solid #aaa;background:#111;color:#fff;padding:11px}.live-time span{display:block;color:#bbb;font-size:10px}.live-time strong{display:block;margin-top:4px;font:900 24px ui-monospace,SFMono-Regular,Menlo,monospace}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="unix-time"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../cookie-cache/">Webの状態管理を学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">UNIX TIME</span><h1>Unix時間変換</h1><p>Unix秒・ミリ秒と日時を相互に変換します。</p></section><div class="live-time"><span>現在のUnix時間（秒）</span><strong data-live>—</strong></div><section class="tool-panel"><h2>Unix時間から日時へ</h2><div class="tool-field"><label for="unixValue">Unix時間</label><input id="unixValue" class="tool-input mono" inputmode="numeric" autocomplete="off"></div><div class="time-choice" role="group" aria-label="Unix時間の単位"><button class="tool-btn primary" type="button" data-unix-mode="auto">自動判定</button><button class="tool-btn" type="button" data-unix-mode="sec">秒</button><button class="tool-btn" type="button" data-unix-mode="ms">ミリ秒</button><button class="tool-btn soft" type="button" data-now-unix>現在時刻</button></div><div class="tool-error" data-unix-error></div><div class="result-grid two"><div class="result-box primary"><span class="result-label">JST / 日本時間</span><strong class="result-value" data-jst>—</strong></div><div class="result-box"><span class="result-label">UTC</span><strong class="result-value" data-utc>—</strong></div><div class="result-box"><span class="result-label">ISO 8601</span><div class="copy-line"><strong class="result-value" data-iso>—</strong><button class="copy-mini" type="button" data-copy-iso>コピー</button></div></div><div class="result-box"><span class="result-label">DETECTED UNIT</span><strong class="result-value" data-unit>—</strong></div></div></section><section class="tool-panel"><h2>日時からUnix時間へ</h2><div class="tool-field"><label for="dateValue">日時</label><input id="dateValue" class="tool-input mono" type="datetime-local" step="1"></div><div class="time-choice" role="group" aria-label="入力日時のタイムゾーン"><button class="tool-btn primary" type="button" data-zone="jst">日本時間（JST）</button><button class="tool-btn" type="button" data-zone="utc">UTC</button><button class="tool-btn soft" type="button" data-now-date>現在時刻</button></div><div class="tool-error" data-date-error></div><div class="result-grid two"><div class="result-box primary"><span class="result-label">UNIX SECONDS</span><div class="copy-line"><strong class="result-value" data-seconds>—</strong><button class="copy-mini" type="button" data-copy-sec>コピー</button></div></div><div class="result-box"><span class="result-label">UNIX MILLISECONDS</span><div class="copy-line"><strong class="result-value" data-millis>—</strong><button class="copy-mini" type="button" data-copy-ms>コピー</button></div></div></div></section><details class="tool-more"><summary>判定方法</summary><p>自動判定では絶対値が1000億以上ならミリ秒、それ未満なら秒として扱います。日時から変換する場合は、日本時間またはUTCを明示して計算します。</p></details></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],unix=$('#unixValue'),date=$('#dateValue'),uErr=$('[data-unix-error]'),dErr=$('[data-date-error]');let mode='auto',zone='jst',tracked=false;const track=()=>{if(!tracked&&window.CBL&&CBL.track){tracked=true;CBL.track('tool_use',{tool_name:'unix-time'})}};const pad=n=>String(n).padStart(2,'0');const jstText=d=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);const utcText=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' UTC';const localValue=(d,z)=>{if(z==='utc')return d.toISOString().slice(0,19);const x=new Date(d.getTime()+9*3600000);return x.toISOString().slice(0,19)};const copy=async(v,b)=>{try{await navigator.clipboard.writeText(v);const t=b.textContent;b.textContent='コピー済み';setTimeout(()=>b.textContent=t,900)}catch{prompt('コピーしてください',v)}};const runUnix=()=>{try{const raw=unix.value.trim();if(!/^-?\d+(?:\.\d+)?$/.test(raw))throw Error('Unix時間を数値で入力してください。');const n=Number(raw);if(!Number.isFinite(n))throw Error('数値が大きすぎます。');const detected=mode==='auto'?(Math.abs(n)>=100000000000?'ms':'sec'):mode,ms=detected==='ms'?n:n*1000,d=new Date(ms);if(Number.isNaN(d.getTime()))throw Error('日時へ変換できる範囲を超えています。');uErr.classList.remove('show');$('[data-jst]').textContent=jstText(d);$('[data-utc]').textContent=utcText(d);$('[data-iso]').textContent=d.toISOString();$('[data-unit]').textContent=detected==='ms'?'ミリ秒':'秒';track()}catch(e){uErr.textContent=e.message;uErr.classList.add('show');['jst','utc','iso','unit'].forEach(k=>$('[data-'+k+']').textContent='—')}};const runDate=()=>{try{const v=date.value;if(!v)throw Error('日時を入力してください。');const base=v.length===16?v+':00':v,ms=Date.parse(base+(zone==='jst'?'+09:00':'Z'));if(!Number.isFinite(ms))throw Error('日時を確認してください。');dErr.classList.remove('show');$('[data-seconds]').textContent=Math.floor(ms/1000).toString();$('[data-millis]').textContent=Math.trunc(ms).toString();track()}catch(e){dErr.textContent=e.message;dErr.classList.add('show');$('[data-seconds]').textContent=$('[data-millis]').textContent='—'}};$$('[data-unix-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.unixMode;$$('[data-unix-mode]').forEach(x=>x.classList.toggle('primary',x===b));runUnix()});$$('[data-zone]').forEach(b=>b.onclick=()=>{zone=b.dataset.zone;$$('[data-zone]').forEach(x=>x.classList.toggle('primary',x===b));runDate()});$('[data-now-unix]').onclick=()=>{unix.value=Math.floor(Date.now()/1000);mode='auto';$$('[data-unix-mode]').forEach(x=>x.classList.toggle('primary',x.dataset.unixMode==='auto'));runUnix()};$('[data-now-date]').onclick=()=>{date.value=localValue(new Date(),zone);runDate()};unix.addEventListener('input',runUnix);date.addEventListener('input',runDate);$('[data-copy-iso]').onclick=()=>copy($('[data-iso]').textContent,$('[data-copy-iso]'));$('[data-copy-sec]').onclick=()=>copy($('[data-seconds]').textContent,$('[data-copy-sec]'));$('[data-copy-ms]').onclick=()=>copy($('[data-millis]').textContent,$('[data-copy-ms]'));const tick=()=>{$('[data-live]').textContent=Math.floor(Date.now()/1000).toString()};tick();setInterval(tick,1000);unix.value=Math.floor(Date.now()/1000);date.value=localValue(new Date(),'jst');runUnix();runDate()})();</script></body></html>
