<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KB・MB・GB・KiB・MiB 容量換算ツール | Computer Basics Lab</title><meta name="description" content="bit、byte、KB、MB、GB、KiB、MiB、GiBを即換算。1000系と1024系の違いも同時に確認できます。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/data-size/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.unit-choice{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.unit-choice .tool-btn{padding:7px 4px}.unit-choice .primary{background:#111;color:#fff}@media(max-width:480px){.unit-choice{grid-template-columns:repeat(3,1fr)}}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="data-size-tool"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../data-size/">仕組みを学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">DATA SIZE</span><h1>容量換算</h1><p>数値を入れて単位をタップ。1000系と1024系を同時表示。</p></section><section class="tool-panel"><div class="tool-field"><label for="sizeValue">値</label><input id="sizeValue" class="tool-input mono" type="number" min="0" step="any" value="1" inputmode="decimal"></div><div class="tool-field"><label>入力単位</label><div class="unit-choice" role="group"><button class="tool-btn" type="button" data-unit="bit">bit</button><button class="tool-btn primary" type="button" data-unit="B">byte</button><button class="tool-btn" type="button" data-unit="KB">KB</button><button class="tool-btn" type="button" data-unit="MB">MB</button><button class="tool-btn" type="button" data-unit="GB">GB</button><button class="tool-btn" type="button" data-unit="KiB">KiB</button><button class="tool-btn" type="button" data-unit="MiB">MiB</button><button class="tool-btn" type="button" data-unit="GiB">GiB</button></div></div><div class="tool-error" data-error></div><div class="result-grid two"><div class="result-box primary"><span class="result-label">BYTE</span><strong class="result-value" data-byte>—</strong></div><div class="result-box"><span class="result-label">BIT</span><strong class="result-value" data-bit>—</strong></div><div class="result-box"><span class="result-label">DECIMAL / 1000系</span><strong class="result-value" data-si>—</strong></div><div class="result-box"><span class="result-label">BINARY / 1024系</span><strong class="result-value" data-iec>—</strong></div></div><div class="tool-note">KB・MB・GBは1000倍。KiB・MiB・GiBは1024倍です。</div></section></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{const input=document.getElementById('sizeValue'),buttons=[...document.querySelectorAll('[data-unit]')],err=document.querySelector('[data-error]');let unit='B';const mul={bit:1/8,B:1,KB:1e3,MB:1e6,GB:1e9,KiB:1024,MiB:1048576,GiB:1073741824};const fmt=n=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP',{maximumFractionDigits:8}).format(n):'—';const run=()=>{const v=Number(input.value);if(!Number.isFinite(v)||v<0){err.textContent='0以上の数値を入力してください';err.classList.add('show');return}err.classList.remove('show');const b=v*mul[unit];document.querySelector('[data-byte]').textContent=fmt(b)+' B';document.querySelector('[data-bit]').textContent=fmt(b*8)+' bit';document.querySelector('[data-si]').textContent=fmt(b/1e3)+' KB / '+fmt(b/1e6)+' MB / '+fmt(b/1e9)+' GB';document.querySelector('[data-iec]').textContent=fmt(b/1024)+' KiB / '+fmt(b/1048576)+' MiB / '+fmt(b/1073741824)+' GiB'};buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('primary'));b.classList.add('primary');unit=b.dataset.unit;run()});input.oninput=run;run()})();</script></body></html>
