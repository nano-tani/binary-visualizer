<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64エンコード・デコードツール | Computer Basics Lab</title><meta name="description" content="UTF-8テキストをBase64へエンコード、Base64をUTF-8へデコードできます。標準Base64とURL Safe Base64に対応します。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/base64/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.base64-choice{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.base64-choice .tool-btn{width:100%}.base64-result{min-height:150px}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="base64"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../text-encoding/">文字コードを学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">BASE64</span><h1>Base64変換</h1><p>UTF-8の文字列をBase64へ変換し、Base64から文字列へ戻せます。</p></section><section class="tool-panel"><div class="tool-field"><label for="base64Input">入力</label><textarea id="base64Input" class="tool-textarea mono" spellcheck="false">Computer Basics Lab 日本語</textarea></div><div class="base64-choice" role="group" aria-label="Base64形式"><button class="tool-btn primary" type="button" data-b64-format="standard">標準 Base64</button><button class="tool-btn" type="button" data-b64-format="url">URL Safe Base64</button></div><div class="tool-actions"><button class="tool-btn primary" type="button" data-b64-action="encode">エンコード</button><button class="tool-btn" type="button" data-b64-action="decode">デコード</button><button class="tool-btn soft" type="button" data-b64-swap>入力と結果を入れ替え</button><button class="tool-btn soft" type="button" data-b64-clear>クリア</button></div><div class="tool-error" data-error></div><div class="result-grid two"><div class="result-box"><span class="result-label">INPUT SIZE</span><strong class="result-value" data-input-size>—</strong></div><div class="result-box"><span class="result-label">OUTPUT SIZE</span><strong class="result-value" data-output-size>—</strong></div></div><div class="tool-field"><label for="base64Output">結果</label><textarea id="base64Output" class="tool-textarea mono base64-result" readonly spellcheck="false"></textarea></div><div class="tool-actions"><button class="tool-btn primary" type="button" data-b64-copy>結果をコピー</button></div><div class="tool-note warn">Base64はデータの表現方法であり、暗号化ではありません。秘密情報の保護には使えません。</div></section><details class="tool-more"><summary>URL Safe Base64について</summary><p>URL Safeでは <code>+</code> を <code>-</code>、<code>/</code> を <code>_</code> に置き換え、末尾の <code>=</code> を省略します。JWTなどで使われる形式です。</p></details></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],input=$('#base64Input'),output=$('#base64Output'),err=$('[data-error]'),inputSize=$('[data-input-size]'),outputSize=$('[data-output-size]'),enc=new TextEncoder(),dec=new TextDecoder('utf-8',{fatal:true});let format='standard',tracked=false;const track=()=>{if(!tracked&&window.CBL&&CBL.track){tracked=true;CBL.track('tool_use',{tool_name:'base64'})}};const bytesToB64=bytes=>{let bin='',step=32768;for(let i=0;i<bytes.length;i+=step)bin+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(bin)};const b64ToBytes=raw=>{let s=raw.replace(/\s+/g,'');if(format==='url')s=s.replace(/-/g,'+').replace(/_/g,'/');else if(/[-_]/.test(s))throw Error('URL Safe Base64をデコードする場合はURL Safeを選んでください。');if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s)||s.length%4===1)throw Error('Base64の文字列を確認してください。');s=s.replace(/=+$/,'');s+= '='.repeat((4-s.length%4)%4);let bin;try{bin=atob(s)}catch{throw Error('Base64としてデコードできません。')}return Uint8Array.from(bin,c=>c.charCodeAt(0))};const convert=action=>{try{err.classList.remove('show');if(action==='encode'){const bytes=enc.encode(input.value);let result=bytesToB64(bytes);if(format==='url')result=result.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');output.value=result;inputSize.textContent=bytes.length.toLocaleString()+' byte';outputSize.textContent=enc.encode(result).length.toLocaleString()+' byte'}else{const bytes=b64ToBytes(input.value);let result;try{result=dec.decode(bytes)}catch{throw Error('デコード結果はUTF-8の文字列ではありません。')}output.value=result;inputSize.textContent=enc.encode(input.value).length.toLocaleString()+' byte';outputSize.textContent=bytes.length.toLocaleString()+' byte'}track()}catch(e){output.value='';err.textContent=e.message;err.classList.add('show');outputSize.textContent='—'}};$$('[data-b64-format]').forEach(b=>b.onclick=()=>{format=b.dataset.b64Format;$$('[data-b64-format]').forEach(x=>x.classList.toggle('primary',x===b));convert('encode')});$$('[data-b64-action]').forEach(b=>b.onclick=()=>convert(b.dataset.b64Action));$('[data-b64-swap]').onclick=()=>{if(output.value){const old=input.value;input.value=output.value;output.value=old;input.focus()}};$('[data-b64-clear]').onclick=()=>{input.value='';output.value='';inputSize.textContent='0 byte';outputSize.textContent='—';err.classList.remove('show');input.focus()};$('[data-b64-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);const b=$('[data-b64-copy]'),t=b.textContent;b.textContent='コピー済み';setTimeout(()=>b.textContent=t,900)}catch{prompt('コピーしてください',output.value)}};input.addEventListener('input',()=>{inputSize.textContent=enc.encode(input.value).length.toLocaleString()+' byte'});convert('encode')})();</script></body></html>
