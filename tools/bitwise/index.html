<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AND・OR・XOR ビット演算計算ツール | Computer Basics Lab</title><meta name="description" content="0〜255の2つの数をAND・OR・XOR・NOTで即計算。10進数、2進数、16進数を同時表示します。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/bitwise/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="bitwise-tool"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../bitwise/">仕組みを学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">BITWISE</span><h1>ビット演算</h1><p>AとBの値を入力し、AND・OR・XOR・NOTを選んで計算できます。</p></section><section class="tool-panel"><div class="tool-row two"><div class="tool-field"><label for="bitA">A（0〜255）</label><input id="bitA" class="tool-input mono" type="number" min="0" max="255" value="170" inputmode="numeric"></div><div class="tool-field"><label for="bitB">B（0〜255）</label><input id="bitB" class="tool-input mono" type="number" min="0" max="255" value="204" inputmode="numeric"></div></div><div class="tool-actions" role="group" aria-label="演算"><button class="tool-btn primary" type="button" data-op="and">AND</button><button class="tool-btn" type="button" data-op="or">OR</button><button class="tool-btn" type="button" data-op="xor">XOR</button><button class="tool-btn" type="button" data-op="nota">NOT A</button><button class="tool-btn" type="button" data-op="notb">NOT B</button></div><div class="tool-error" data-error></div><div class="result-grid three"><div class="result-box primary"><span class="result-label">BIN / 2進数</span><strong class="result-value" data-bin>—</strong></div><div class="result-box"><span class="result-label">DEC / 10進数</span><strong class="result-value" data-dec>—</strong></div><div class="result-box"><span class="result-label">HEX / 16進数</span><strong class="result-value" data-hex>—</strong></div></div><div class="mono-block" data-detail></div></section><details class="tool-more"><summary>見方</summary><p>AND・OR・XORは各bitを同じ位置どうしで比べます。NOTは8bitの範囲で0と1を反転します。</p></details></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{const A=document.getElementById('bitA'),B=document.getElementById('bitB'),err=document.querySelector('[data-error]'),bin=document.querySelector('[data-bin]'),dec=document.querySelector('[data-dec]'),hex=document.querySelector('[data-hex]'),detail=document.querySelector('[data-detail]'),buttons=[...document.querySelectorAll('[data-op]')];let op='and';const bits=n=>n.toString(2).padStart(8,'0').replace(/(.{4})(.{4})/,'$1 $2');const read=x=>{const n=Number(x.value);if(!Number.isInteger(n)||n<0||n>255)throw Error('AとBは0〜255の整数で入力してください');return n};const run=()=>{try{const a=read(A),b=read(B);let r,label;if(op==='and'){r=a&b;label='A AND B'}else if(op==='or'){r=a|b;label='A OR B'}else if(op==='xor'){r=a^b;label='A XOR B'}else if(op==='nota'){r=(~a)&255;label='NOT A'}else{r=(~b)&255;label='NOT B'}err.classList.remove('show');bin.textContent=bits(r);dec.textContent=r;hex.textContent=r.toString(16).toUpperCase().padStart(2,'0');detail.textContent='A  '+bits(a)+'\nB  '+bits(b)+'\n→ '+label+' = '+bits(r)}catch(e){err.textContent=e.message;err.classList.add('show')}};buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('primary'));b.classList.add('primary');op=b.dataset.op;run()});A.oninput=B.oninput=run;run()})();</script></body></html>
