<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON整形・構文チェックツール | Computer Basics Lab</title><meta name="description" content="JSONを整形・圧縮し、構文エラーを確認できます。2スペース・4スペースの整形、コピー、型・階層・キー数の確認に対応します。"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://nano-tani.github.io/binary-visualizer/tools/json/"><link rel="icon" href="../../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../assets/site.6723d7db56.css"><link rel="stylesheet" href="../../assets/tools.20260827.css"><style>.json-output{min-height:220px}.json-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}@media(min-width:700px){.json-stats{grid-template-columns:repeat(4,1fr)}}.json-status{margin-top:10px;padding:10px 11px;border-left:4px solid #777;background:#eee;font-size:12px}.json-status.ok{border-color:#477952;background:#edf5ed}.json-status.ng{border-color:#9a4943;background:#fae9e8}</style><script defer src="../../assets/core.2b92699b07.js"></script></head><body data-tool="json"><header class="tool-header"><div class="tool-wrap"><a class="tool-brand" href="../">← ツール一覧<small>Computer Basics Lab</small></a><nav class="tool-header-nav"><a href="../../http-https/">Web通信を学ぶ</a></nav></div></header><main class="tool-main"><div class="tool-wrap"><section class="tool-hero"><span class="tool-kicker">JSON</span><h1>JSON整形・構文チェック</h1><p>JSONを貼り付けると、整形・圧縮と構文チェックができます。</p></section><section class="tool-panel"><div class="tool-field"><label for="jsonInput">JSON</label><textarea id="jsonInput" class="tool-textarea mono" spellcheck="false" autocomplete="off">{"user":{"id":42,"name":"Taro"},"enabled":true,"tags":["network","web"]}</textarea></div><div class="tool-actions"><button class="tool-btn primary" type="button" data-json-action="format2">2スペースで整形</button><button class="tool-btn" type="button" data-json-action="format4">4スペースで整形</button><button class="tool-btn" type="button" data-json-action="minify">圧縮</button><button class="tool-btn soft" type="button" data-json-action="validate">構文チェック</button><button class="tool-btn soft" type="button" data-json-clear>クリア</button></div><div class="json-status" data-json-status>—</div><div class="json-stats"><div class="result-box"><span class="result-label">TYPE</span><strong class="result-value" data-json-type>—</strong></div><div class="result-box"><span class="result-label">DEPTH</span><strong class="result-value" data-json-depth>—</strong></div><div class="result-box"><span class="result-label">KEYS / ITEMS</span><strong class="result-value" data-json-count>—</strong></div><div class="result-box"><span class="result-label">UTF-8 SIZE</span><strong class="result-value" data-json-size>—</strong></div></div><div class="tool-field"><label for="jsonOutput">結果</label><textarea id="jsonOutput" class="tool-textarea mono json-output" readonly spellcheck="false"></textarea></div><div class="tool-actions"><button class="tool-btn primary" type="button" data-json-copy>結果をコピー</button><button class="tool-btn soft" type="button" data-json-use>結果を入力欄へ移す</button></div></section><details class="tool-more"><summary>仕様</summary><p>JSON.parseで構文を確認し、JSON.stringifyで整形・圧縮します。JavaScriptとして実行する処理は行いません。入力が1MBを超える場合は処理を止めます。</p></details></div></main><footer class="tool-footer"><div class="tool-wrap"><a href="../">ツール一覧</a> · <a href="../../privacy/">プライバシー</a></div></footer><script>(()=>{'use strict';const $=s=>document.querySelector(s),input=$('#jsonInput'),output=$('#jsonOutput'),status=$('[data-json-status]'),type=$('[data-json-type]'),depth=$('[data-json-depth]'),count=$('[data-json-count]'),size=$('[data-json-size]'),enc=new TextEncoder();let tracked=false;const track=()=>{if(!tracked&&window.CBL&&CBL.track){tracked=true;CBL.track('tool_use',{tool_name:'json'})}};const copy=async(v,b)=>{try{await navigator.clipboard.writeText(v);const t=b.textContent;b.textContent='コピー済み';setTimeout(()=>b.textContent=t,900)}catch{prompt('コピーしてください',v)}};const info=v=>{const root=Array.isArray(v)?'Array':v===null?'null':typeof v==='object'?'Object':typeof v;let max=0,total=0,stack=[[v,1]];while(stack.length){const [x,d]=stack.pop();max=Math.max(max,d);if(Array.isArray(x)){total+=x.length;for(const y of x)if(y&&typeof y==='object')stack.push([y,d+1])}else if(x&&typeof x==='object'){const vals=Object.values(x);total+=vals.length;for(const y of vals)if(y&&typeof y==='object')stack.push([y,d+1])}}return{root,max,total}};const parse=()=>{const raw=input.value;if(enc.encode(raw).length>1048576)throw Error('入力が1MBを超えています。');try{return JSON.parse(raw)}catch(e){const m=String(e.message||e);let extra='';const p=m.match(/position\s+(\d+)/i);if(p){const pos=Number(p[1]),before=raw.slice(0,pos),line=before.split('\n').length,col=pos-before.lastIndexOf('\n');extra='（'+line+'行 '+col+'文字付近）'}throw Error('JSONの構文を確認してください。'+extra+' '+m)}};const setStats=(v,text)=>{const i=info(v);type.textContent=i.root;depth.textContent=i.max;count.textContent=i.total.toLocaleString();size.textContent=enc.encode(text).length.toLocaleString()+' byte'};const run=action=>{try{const v=parse();let text=input.value;if(action==='format2')text=JSON.stringify(v,null,2);else if(action==='format4')text=JSON.stringify(v,null,4);else if(action==='minify')text=JSON.stringify(v);else text=JSON.stringify(v,null,2);output.value=text;status.textContent='JSONとして正しく読み取れます。';status.className='json-status ok';setStats(v,text);track()}catch(e){output.value='';status.textContent=e.message;status.className='json-status ng';[type,depth,count,size].forEach(x=>x.textContent='—')}};document.querySelectorAll('[data-json-action]').forEach(b=>b.onclick=()=>run(b.dataset.jsonAction));$('[data-json-copy]').onclick=()=>copy(output.value,$('[data-json-copy]'));$('[data-json-use]').onclick=()=>{if(output.value){input.value=output.value;input.focus()}};$('[data-json-clear]').onclick=()=>{input.value='';output.value='';status.textContent='—';status.className='json-status';[type,depth,count,size].forEach(x=>x.textContent='—');input.focus()};run('format2')})();</script></body></html>
